# v5 QA cases — Final Report Submission
# Scope: service functional/data/state/validation QA only.
# Design-generation coverage and pixel/visual review are intentionally excluded.

- id: QA-V5-A30-001
  release: v5
  screen: "A-30 내 지원 현황"
  category: STATE
  precondition: |
    본선 진출 팀이며 1차 지원서 7개 section이 완료되고 최종보고서 신규 section은 미완료다.
  action: |
    A-30을 연다.
  expected: |
    최종보고서 completion은 7/8로 시작한다.
  automationCandidate: true

